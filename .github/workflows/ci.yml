# Every pull request to main, and every push to main, is checked by house on a
# GitHub-hosted machine. Never a self-hosted runner: this repository is public,
# and house refuses a public repository on a self-hosted runner.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  house:
    name: house
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Install the tools house runs
        run: brew install ruff semgrep gitleaks shellcheck swiftlint

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: cargo build --release
        run: cargo build --release --locked

      - name: house check --all
        run: ./target/release/house check --all
