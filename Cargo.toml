[package]
name = "house"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "Runs the tools that check the rules we care about, replies to agents in one format, records every run."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "deny"
