# R9 "nothing silenced; fix the root cause".
# Run: semgrep scan --metrics=off --config patterns/r9.yml <targets>
# Caveats, on purpose (smallest thing that works):
# - Comment and attribute rules are text (pattern-regex). They never match inside
#   a string literal (pattern-not-inside a string). Rust attributes count only at
#   the start of a line, so `// #[allow(x)]` in a comment does not; `try?` counts
#   only before any `//` on its line.
# - "in tests" means: Swift files named *Tests.swift or under a *Tests/ or
#   Tests/ folder; Rust code inside `mod tests { ... }` or under tests/, or a
#   tests.rs file.
# - Rust `let _ = ` cannot see types, so it reports every `let _ =` in tests,
#   not only those on a Result. Cleanup is exempt, where there is nobody to hand
#   the error to: a `Drop` impl, a `defer!` block, a function named teardown
#   or tear_down, and anywhere a `let _ =` straight on a call to kill, wait,
#   try_wait, send, flush, shutdown or join (a method) or remove_file or
#   remove_dir_all, whatever its arguments.
#   Swift `try?` is exempt in `defer`, `deinit` and tearDown/tearDownWithError,
#   anywhere on a FileManager removeItem(at:) or removeItem(atPath:), on a call
#   named close, remove, delete or unlink (and their File/Directory forms), and
#   where its result is checked, in one of the shapes the rule lists (an
#   assertion's value argument, or a comparison with == or !=). XCTAssertNoThrow
#   (try? x) and a try? in an assertion's message are still reported.
rules:
  # ---- Python ----
  - id: r9-python-noqa
    languages: [python]
    severity: WARNING
    message: "a `# noqa` comment silences a lint finding"
    metadata:
      fix: "remove the noqa comment and fix what the linter reports"
    patterns:
      - pattern-regex: '(?i)#\s*(ruff:\s*)?noqa\b'
      - pattern-not-inside: '"..."'

  - id: r9-python-type-ignore
    languages: [python]
    severity: WARNING
    message: "a `# type: ignore` comment silences a type error"
    metadata:
      fix: "remove the type: ignore comment and fix the type error"
    patterns:
      - pattern-regex: '#\s*type:\s*ignore\b'
      - pattern-not-inside: '"..."'

  - id: r9-python-pylint-disable
    languages: [python]
    severity: WARNING
    message: "a `# pylint: disable` comment silences Pylint"
    metadata:
      fix: "remove the pylint: disable comment and fix what Pylint reports"
    patterns:
      - pattern-regex: '#\s*pylint:\s*disable'
      - pattern-not-inside: '"..."'

  - id: r9-python-no-cover
    languages: [python]
    severity: WARNING
    message: "a `# pragma: no cover` comment hides code from coverage"
    metadata:
      fix: "remove the pragma: no cover comment and test that code, or delete it"
    patterns:
      - pattern-regex: '#\s*pragma:\s*no\s*cover\b'
      - pattern-not-inside: '"..."'

  - id: r9-python-pytest-skip
    languages: [python]
    severity: WARNING
    message: "a pytest skip or xfail turns a test off"
    metadata:
      fix: "remove the skip or xfail and make the test pass"
    pattern-either:
      - pattern: "@pytest.mark.skip"
      - pattern: "@pytest.mark.skip(...)"
      - pattern: "@pytest.mark.skipif(...)"
      - pattern: "@pytest.mark.xfail"
      - pattern: "@pytest.mark.xfail(...)"
      - pattern: pytest.skip(...)
      - pattern: pytest.xfail(...)

  - id: r9-python-unittest-skip
    languages: [python]
    severity: WARNING
    message: "a unittest skip turns a test off"
    metadata:
      fix: "remove the skip and make the test pass"
    # As calls, so a skip decorator kept in a name (`needs_x = unittest.skipUnless(...)`)
    # counts too.
    pattern-either:
      - pattern: unittest.skip(...)
      - pattern: unittest.skipIf(...)
      - pattern: unittest.skipUnless(...)
      - pattern: "@unittest.expectedFailure"
      - pattern: unittest.SkipTest(...)
      - pattern: $SELF.skipTest(...)

  # ---- Shell ----
  - id: r9-shell-shellcheck-disable
    languages: [bash]
    severity: WARNING
    message: "a `# shellcheck disable` comment silences ShellCheck"
    metadata:
      fix: "remove the shellcheck disable comment and fix what ShellCheck reports"
    # A directive is a comment line of its own; a line inside a string or a
    # heredoc that only mentions one does not start with it.
    pattern-regex: '(?m)^[ \t]*#[ \t]*shellcheck[ \t]+disable\b'

  # ---- TypeScript and JavaScript ----
  # In these languages '"..."' is any string: single, double or template quotes.
  - id: r9-ts-ignore
    languages: [typescript, javascript]
    severity: WARNING
    message: "a `@ts-ignore`, `@ts-expect-error` or `@ts-nocheck` comment silences tsc"
    metadata:
      fix: "remove the comment and fix the type error"
    patterns:
      - pattern-regex: '(//|/\*)\s*@ts-(ignore|expect-error|nocheck)\b'
      - pattern-not-inside: '"..."'

  - id: r9-js-eslint-disable
    languages: [typescript, javascript]
    severity: WARNING
    message: "an `eslint-disable` comment silences ESLint"
    metadata:
      fix: "remove the eslint-disable comment and fix what ESLint reports"
    # eslint-disable, eslint-disable-line and eslint-disable-next-line, in a line
    # or a block comment. ESLint's inline rule settings (`/* eslint rule: "off" */`)
    # are not matched.
    patterns:
      - pattern-regex: '(//|/\*)\s*eslint-disable(-next-line|-line)?\b'
      - pattern-not-inside: '"..."'

  - id: r9-js-test-skip
    languages: [typescript, javascript]
    severity: WARNING
    message: "a `.skip` or `x`-prefixed test turns a test off"
    metadata:
      fix: "remove the skip and make the test pass"
    # Jest, Vitest and Mocha names only: `.skip` on another object is not matched.
    # Node's test runner options (`{ skip: true }`) are not matched.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $T.skip(...)
              - pattern: $T.skip.each(...)
              - pattern: $T.skipIf(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^(it|test|describe|context|suite)$
      - pattern: xit(...)
      - pattern: xtest(...)
      - pattern: xdescribe(...)

  - id: r9-js-test-only
    languages: [typescript, javascript]
    severity: WARNING
    message: "a `.only` or `f`-prefixed test turns every other test in the file off"
    metadata:
      fix: "remove the only so the whole suite runs"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $T.only(...)
              - pattern: $T.only.each(...)
          - metavariable-regex:
              metavariable: $T
              regex: ^(it|test|describe|context|suite)$
      - pattern: fit(...)
      - pattern: fdescribe(...)

  # ---- Swift ----
  - id: r9-swift-swiftlint-disable
    languages: [swift]
    severity: WARNING
    message: "a `swiftlint:disable` comment silences SwiftLint"
    metadata:
      fix: "remove the swiftlint:disable comment and fix what SwiftLint reports"
    patterns:
      - pattern-regex: '(//|/\*)\s*swiftlint:disable\b'
      - pattern-not-inside: '"..."'

  - id: r9-swift-tool-ignore
    languages: [swift]
    severity: WARNING
    message: "a `swiftformat:disable` or `periphery:ignore` comment silences a tool"
    metadata:
      fix: "remove the comment and fix what the tool reports"
    patterns:
      - pattern-regex: '(//|/\*)\s*(swiftformat:disable|periphery:ignore)\b'
      - pattern-not-inside: '"..."'

  - id: r9-swift-xctskip
    languages: [swift]
    severity: WARNING
    message: "XCTSkip turns a test off"
    metadata:
      fix: "remove the XCTSkip and make the test pass"
    pattern-either:
      - pattern: XCTSkip(...)
      - pattern: XCTSkipIf(...)
      - pattern: XCTSkipUnless(...)

  - id: r9-swift-expected-failure
    languages: [swift]
    severity: WARNING
    message: "an expected-failure marker lets a failing test pass"
    metadata:
      fix: "remove XCTExpectFailure or withKnownIssue and fix the failure"
    pattern-either:
      - pattern: XCTExpectFailure(...)
      - pattern: withKnownIssue(...)

  - id: r9-swift-testing-disabled
    languages: [swift]
    severity: WARNING
    message: "a `.disabled(...)` trait on @Test or @Suite turns a test off"
    metadata:
      fix: "remove the .disabled trait and make the test pass"
    # Only as a trait argument inside @Test(...) or @Suite(...), so SwiftUI's
    # `.disabled(!x)` view modifier is not matched. One level of nested
    # parentheses is allowed before the trait, e.g. @Test("name", .tags(.a), .disabled()).
    patterns:
      - pattern-regex: '@(Test|Suite)\b\s*\((?:[^()]|\([^()]*\))*?\.disabled\s*\('
      - pattern-not-inside: '"..."'

  - id: r9-swift-try-optional-in-tests
    languages: [swift]
    severity: WARNING
    message: "`try?` in a test swallows the error"
    metadata:
      fix: "use try so a thrown error fails the test"
    paths:
      include:
        - "*Tests.swift"
        - "**/*Tests/**"
        - "**/Tests/**"
    # Semgrep's Swift AST treats `try?` and `try` alike, so this is text; `\K`
    # starts the match at `try?`, and only when no `//` comes before it on the line.
    # `\G` goes on from the last match, so every try? on a line is seen.
    patterns:
      - pattern-regex: '(?m)(?:^|\G)(?:(?!//)[^\n])*?\K\btry\?(?=\s)'
      - pattern-not-inside: '"..."'
      - pattern-not-inside: "defer { ... }"
      - pattern-not-inside: "func tearDown() { ... }"
      - pattern-not-inside: "func tearDownWithError() { ... }"
      # Semgrep's Swift patterns cannot name a deinit, so it is text (one level
      # of nested braces inside).
      - pattern-not-regex: '\bdeinit\s*\{(?:[^{}]|\{[^{}]*\})*\}'
      # Removing a file or folder anywhere: `try?` straight on a FileManager
      # removeItem(at:) or removeItem(atPath:) call, the receiver a plain name chain.
      - pattern-not-regex: '\btry\?\s+[\w.]*\bremoveItem\s*\(\s*(?:at|atPath)\s*:'
      # Other cleanup anywhere: `try?` straight on a call named close, closeFile,
      # remove, removeFile, removeDirectory, delete, deleteFile or unlink. A call
      # that only starts with one of those names (closeAccount) is not cleanup.
      - pattern-not-regex: '\btry\?\s+[\w.]*\b(?:close|closeFile|remove|removeFile|removeDirectory|delete|deleteFile|unlink)\s*\('
      # The CHECKED shapes, the only places a try? result is exempt because a test
      # inspects it; each is allowed with and without redundant parentheses around
      # the try? expression, and each has one line in
      # tests/fixtures/semgrep_r9/swift/AppTests/AssertedTests.swift:
      #   (a) the first argument of XCTAssertNil, XCTAssertNotNil, XCTUnwrap or
      #       #require:  XCTAssertNil(try? x)   XCTAssertNil((try? x))
      #   (b) the first or second argument of XCTAssertEqual or XCTAssertNotEqual:
      #       XCTAssertEqual(try? x, y)   XCTAssertEqual(y, (try? x))
      #   (c) a comparison of the result with == or !=, anywhere, #expect included:
      #       (try? x) != nil   ((try? x)) == y   y == (try? x)   #expect((try? x) == nil)
      # Everything else is still R9, one line each in UncheckedTests.swift:
      # XCTAssertNoThrow(try? x), a try? in a message argument, a bare try?, a try?
      # inside a call whose result is checked (count(try? x) == 1), and a try? in a
      # #expect that is no comparison. `try? x == nil` is no comparison of the
      # result: try? binds over the whole comparison, giving a Bool?.
      - pattern-not-regex: '(?:\bXCTAssert(?:Nil|NotNil)|\bXCTUnwrap|#require)\s*\(\s*(?:\(\s*)?try\?'
      - pattern-not-regex: '\bXCTAssert(?:Not)?Equal\s*\(\s*(?:\(\s*)?try\?'
      - pattern-not-regex: '\bXCTAssert(?:Not)?Equal\s*\(\s*(?:[^(),\n]|\((?:[^()\n]|\([^()\n]*\))*\))+,\s*(?:\(\s*)?try\?'
      - pattern-not-regex: '(?<![\w)\]?!])\(\s*try\?(?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)\s*[!=]='
      - pattern-not-regex: '(?<![\w)\]?!])\(\s*\(\s*try\?(?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)\s*\)\s*[!=]='
      - pattern-not-regex: '[!=]=\s*(?:\(\s*)?\(\s*try\?'

  # ---- Rust ----
  - id: r9-rust-allow
    languages: [rust]
    severity: WARNING
    message: "an `#[allow(...)]` or `#[expect(...)]` attribute silences a lint"
    metadata:
      fix: "remove the attribute and fix what the lint reports"
    patterns:
      - pattern-either:
          - pattern-regex: '(?m)^[ \t]*#!?\[\s*(allow|expect)\s*\('
          - pattern-regex: '(?m)^[ \t]*#!?\[\s*cfg_attr\s*\([^\]]*\b(allow|expect)\s*\('
      - pattern-not-inside: '"..."'

  - id: r9-rust-ignore
    languages: [rust]
    severity: WARNING
    message: "an `#[ignore]` attribute turns a test off"
    metadata:
      fix: "remove the ignore attribute and make the test pass"
    patterns:
      - pattern-either:
          - pattern-regex: '(?m)^[ \t]*#\[\s*ignore\b'
          - pattern-regex: '(?m)^[ \t]*#\[\s*cfg_attr\s*\([^\]]*\bignore\b'
      - pattern-not-inside: '"..."'

  - id: r9-rust-let-underscore-in-test-mod
    languages: [rust]
    severity: WARNING
    message: "`let _ =` in a test drops a result unchecked"
    metadata:
      fix: "unwrap or assert on the result so an error fails the test"
    patterns:
      - pattern-inside: |
          mod tests { ... }
      - pattern: let _ = $X;
      - pattern-not-inside: "impl Drop for $T { ... }"
      - pattern-not-inside: "defer! { ... }"
      - pattern-not-inside: "fn teardown(...) { ... }"
      - pattern-not-inside: "fn tear_down(...) { ... }"
      # Cleanup anywhere: the call the dropped value comes from is one of these
      # (Semgrep cannot see the type), its arguments nested to any depth.
      - pattern-not: let _ = $R.kill(...);
      - pattern-not: let _ = $R.wait(...);
      - pattern-not: let _ = $R.try_wait(...);
      - pattern-not: let _ = $R.send(...);
      - pattern-not: let _ = $R.flush(...);
      - pattern-not: let _ = $R.shutdown(...);
      - pattern-not: let _ = $R.join(...);
      - pattern-not: let _ = remove_file(...);
      - pattern-not: let _ = $P::remove_file(...);
      - pattern-not: let _ = remove_dir_all(...);
      - pattern-not: let _ = $P::remove_dir_all(...);

  - id: r9-rust-let-underscore-in-tests-dir
    languages: [rust]
    severity: WARNING
    message: "`let _ =` in a test drops a result unchecked"
    metadata:
      fix: "unwrap or assert on the result so an error fails the test"
    paths:
      include:
        - "**/tests/**"
        - "**/tests.rs"
    patterns:
      - pattern: let _ = $X;
      - pattern-not-inside: "impl Drop for $T { ... }"
      - pattern-not-inside: "defer! { ... }"
      - pattern-not-inside: "fn teardown(...) { ... }"
      - pattern-not-inside: "fn tear_down(...) { ... }"
      # Cleanup anywhere: the call the dropped value comes from is one of these
      # (Semgrep cannot see the type), its arguments nested to any depth.
      - pattern-not: let _ = $R.kill(...);
      - pattern-not: let _ = $R.wait(...);
      - pattern-not: let _ = $R.try_wait(...);
      - pattern-not: let _ = $R.send(...);
      - pattern-not: let _ = $R.flush(...);
      - pattern-not: let _ = $R.shutdown(...);
      - pattern-not: let _ = $R.join(...);
      - pattern-not: let _ = remove_file(...);
      - pattern-not: let _ = $P::remove_file(...);
      - pattern-not: let _ = remove_dir_all(...);
      - pattern-not: let _ = $P::remove_dir_all(...);
